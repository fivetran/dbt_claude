schema_variable_name: "claude_schema"

# Only set if not using the default dbt-core/adapter version ranges
# dbt_core_version: ">=1.3.0,<1.12.0"
# dbt_adapter_versions:
#   snowflake: ">=1.3.0,<2.0.0"
#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

# Optional global settings
include_databricks_sql: true
include_sqlserver: false
include_duckdb: true
include_dbt_compile: enabled  # Set to disabled to skip dbt compile step (for repos not yet updated to pass)

# Test scenarios - FIRST MUST BE DEFAULT WITH NO VARS
test_scenarios:
  # REQUIRED: Default scenario with no custom variables
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "Enterprise activity passthrough columns"
    vars:
      claude__enterprise_user_activity_pass_through_metrics:
        - name: "chat_metrics_shared_conversations_viewed_count"
          alias: "shared_conversations_viewed_count"
        - name: "chat_metrics_distinct_skills_used_count"
      claude__using_workspace_member: false
    include_incremental: false

  - name: "Optional tables disabled"
    vars:
      claude__using_organization: false
      claude__using_workspace: false
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true