    message_usage_report:
      +column_types:
        _fivetran_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        api_key_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        workspace_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
