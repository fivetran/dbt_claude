        uncached_input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        model: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        service_tier: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        context_window: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        cache_read_input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_deleted: boolean
        _fivetran_synced: timestamp
    users:
      +column_types:
        id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        added_at: timestamp
        role: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
