name: 'claude_integration_tests'
version: '0.1.0'
config-version: 2
profile: 'integration_tests'

vars:
  claude_schema: claude_integration_tests

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  +schema: "claude_{{ var('directed_schema','dev') }}"
  
seeds:
  +docs:
    show: False
  claude_integration_tests:
    +quote_columns: "{{ target.type in ('redshift', 'postgres', 'duckdb') or var('fivetran_using_source_casing', false) }}"
    claude_code_usage_report:
      +column_types:
        _fivetran_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        organization_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        customer_type: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
