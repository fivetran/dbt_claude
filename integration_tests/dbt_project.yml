        organization_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        model: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        currency: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        context_window: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        inference_geo: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        _fivetran_deleted: boolean
        _fivetran_synced: timestamp
    enterprise_user_usage_report:
      +column_types:
        _fivetran_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        actor_user_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        cache_creation_ephemeral_1_h_input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        cache_creation_ephemeral_5_m_input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        product: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
