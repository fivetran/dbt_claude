name: 'claude_integration_tests'
version: '0.1.0'
config-version: 2
profile: 'integration_tests'

vars:
  claude_schema: claude_integration_tests

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  +schema: "claude_{{ var('directed_schema','dev') }}"
  
seeds:
  +docs:
    show: False
  claude_integration_tests:
    +quote_columns: "{{ target.type in ('redshift', 'postgres', 'duckdb') or var('fivetran_using_source_casing', false) }}"
    claude_code_usage_report:
      +column_types:
        _fivetran_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        organization_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        customer_type: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        date: timestamp
        terminal_type: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        actor_type: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        actor_api_key_name: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        actor_email_address: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        core_metrics_pull_requests_by_claude_code: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        core_metrics_lines_of_code_removed: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        core_metrics_lines_of_code_added: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        core_metrics_commits_by_claude_code: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        core_metrics_num_sessions: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_deleted: boolean
        _fivetran_synced: timestamp
    claude_code_usage_report_model_breakdown:
      +column_types:
        claude_code_usage_report_fivetran_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        model: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        tokens_output: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        tokens_input: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        estimated_cost_currency: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        tokens_cache_creation: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        estimated_cost_amount: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        tokens_cache_read: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        _fivetran_deleted: boolean
        _fivetran_synced: timestamp
    cost_report:
      +column_types:
        _fivetran_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        workspace_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        amount: float
        cost_type: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        starting_at: timestamp
        ending_at: timestamp
        description: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        token_type: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        model: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        service_tier: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        currency: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        context_window: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        inference_geo: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        _fivetran_deleted: boolean
        _fivetran_synced: timestamp
    enterprise_user_actor:
      +column_types:
        id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        deleted: boolean
        name: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        type: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        email: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        _fivetran_deleted: boolean
        _fivetran_synced: timestamp
    enterprise_user_cost_report:
      +column_types:
        _fivetran_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
        actor_user_id: "{{ 'string' if target.type in ('bigquery','spark','databricks') else 'varchar' }}"
