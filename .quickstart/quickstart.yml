database_key: claude_database
schema_key: claude_schema

dbt_versions: ">=1.3.0 <3.0.0"

table_variables:
  claude_using_cost_report:
    - cost_report
  claude_using_enterprise_user_cost_report:
    - enterprise_user_cost_report
  claude_using_message_usage_report:
    - message_usage_report
  claude_using_enterprise_user_usage_report:
    - enterprise_user_usage_report
  claude_using_claude_code_usage_report:
    - claude_code_usage_report
  claude_using_claude_code_usage_report_model_breakdown:
    - claude_code_usage_report_model_breakdown
  claude_using_users:
    - users
  claude_using_enterprise_user_actor:
    - enterprise_user_actor
  claude_using_api_key:
    - api_key
  claude_using_enterprise_user_activity:
    - enterprise_user_activity
  claude_using_organization:
    - organization
  claude_using_workspace:
    - workspace
  claude_using_workspace_member:
    - workspace_member

destination_configurations:
  databricks:
    dispatch:
      - macro_namespace: dbt_utils
        search_order: [ 'spark_utils', 'dbt_utils' ]

public_models: [
  claude__platform_cost_usage_report,
  claude__enterprise_cost_usage_report,
  claude__code_report,
  claude__user_summary
]

supported_vars:
  claude__enterprise_user_activity_pass_through_metrics:
    type: dictionary
    description: "Additional numeric `ENTERPRISE_USER_ACTIVITY` metric columns to sum into `claude__user_summary`"
    display_name: "Additional Enterprise User Activity Metrics"
