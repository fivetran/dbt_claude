      - name: cowork_metrics_distinct_skills_used_count
        description: Number of distinct skills used in Claude Cowork.
      - name: cowork_metrics_message_count
        description: Number of messages sent in Claude Cowork.
      - name: cowork_metrics_skills_used_count
        description: Number of skill invocations in Claude Cowork.
      - name: design_metrics_distinct_projects_created_count
        description: Number of distinct projects created in Claude Design.
      - name: design_metrics_distinct_projects_used_count
