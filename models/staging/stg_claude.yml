      - name: claude_code_metrics_core_metrics_distinct_session_count
        description: Number of distinct sessions in Claude Code.
      - name: claude_code_metrics_core_metrics_lines_of_code_added_count
        description: Lines of code added in Claude Code.
      - name: claude_code_metrics_core_metrics_lines_of_code_removed_count
        description: Lines of code removed in Claude Code.
      - name: claude_code_metrics_core_metrics_pull_request_count
