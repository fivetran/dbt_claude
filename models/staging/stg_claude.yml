version: 2

models:
  - name: stg_claude__cost_report
    description: Staged organization-level cost report. Each row represents one billing line item for a given model, token type, and time period.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: cost_report_id
        description: Fivetran-generated unique identifier for the row.
        tests:
          - not_null
      - name: workspace_id
        description: ID of the Workspace this cost is associated with.
      - name: amount
        description: Cost amount in lowest currency units (e.g. cents) as a decimal string. For example, "123.45" in "USD" represents $1.23.
      - name: cost_type
        description: Category of cost ("code_execution", "session_usage", "tokens", "web_search").
      - name: starting_at
        description: Start of the billing period.
      - name: ending_at
        description: End of the billing period.
      - name: description
        description: Human-readable description of the cost line item.
      - name: token_type
        description: Token type contributing to the cost ("cache_creation.ephemeral_1h_input_tokens", "cache_creation.ephemeral_5m_input_tokens", "cache_read_input_tokens", "output_tokens", "uncached_input_tokens").
      - name: unit_type
        description: Simplified grouping of token_type, derived in this model ("input", "cache_read", "cache_creation_5m", "cache_creation_1h", "output").
      - name: model
        description: Claude model associated with the cost.
      - name: service_tier
        description: Service tier applied to the request ("batch", "standard").
      - name: currency
        description: Currency code for the cost amount. Currently always "USD".
      - name: context_window
        description: Input context window used ("0-200k", "200k-1M").
      - name: inference_geo
        description: Geographic region where inference ran ("global", "not_available", "us").
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__enterprise_user_cost_report
    description: Staged per-user cost report for enterprise accounts. Each row represents cost for one actor over a time period.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: enterprise_user_cost_report_id
        description: Fivetran-generated unique identifier for the row.
        tests:
          - not_null
      - name: actor_user_id
        description: Identifier of the `enterprise_user_actor`.
      - name: product
        description: Anthropic product surface that produced the cost ("chat", "claude_code", "cowork", "office_agent", "claude_in_chrome", "claude_design", "claude-tag" aka Claude in Slack, "other").
      - name: amount
        description: >
          Amount (post-discount, pre-credit) in whole currency units. Converted in this model
          from the source value, which Anthropic reports in fractional cents.
      - name: list_amount
        description: >
          List-price amount (pre-discount) in whole currency units. Converted in this model
          from the source value, which Anthropic reports in fractional cents.
      - name: starting_date
        description: Start of the reporting period (cast to date).
      - name: ending_date
        description: End of the reporting period (cast to date).
      - name: cost_type
        description: Category of cost ("code_execution", "tokens", "web_search").
      - name: token_type
        description: Token type contributing to the cost ("cache_creation.ephemeral_1h_input_tokens", "cache_creation.ephemeral_5m_input_tokens", "cache_read_input_tokens", "output_tokens", "uncached_input_tokens").
      - name: unit_type
        description: >
          Simplified grouping of token_type, derived in this model ("input", "cache_read",
          "cache_creation_5m", "cache_creation_1h", "output"). Null for cost that is not token based.
      - name: data_refreshed_at
        description: Timestamp of the export this response was served from. Data is typically refreshed every 4 hours but not final until about 30 days after the usage date (late-arriving events, reconciliation adjustments).
      - name: speed
        description: Inference speed tier ("fast", "standard").
      - name: organization_id
        description: Identifier of the organization.
      - name: model
        description: Claude model associated with the cost.
      - name: currency
        description: Currency code for the cost amount. Currently always "USD".
      - name: context_window
        description: Input context window used ("0-200k", "200k-1M").
      - name: inference_geo
        description: Geographic region where inference ran ("global", "not_available", "us").
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__message_usage_report
    description: Staged API message usage report. Each row represents token usage for one API request bucket.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: message_usage_report_id
        description: Fivetran-generated unique identifier for the row.
        tests:
          - not_null
      - name: api_key_id
        description: Identifier of the API key used for the requests.
      - name: workspace_id
        description: Identifier of the workspace.
      - name: cache_creation_ephemeral_1_h_input_token
        description: The number of input tokens used to create the 1 hour cache entry.
      - name: cache_creation_ephemeral_5_m_input_token
        description: The number of input tokens used to create the 5 minute cache entry.
      - name: starting_at
        description: Start of the usage period (cast to date).
      - name: ending_at
        description: End of the usage period (cast to date).
      - name: output_token
        description: The number of output tokens generated.
      - name: server_tool_use_web_search_request
        description: The number of server-side web search requests made.
      - name: uncached_input_token
        description: The number of uncached input tokens processed.
      - name: model
        description: Claude model that served the requests.
      - name: service_tier
        description: Service tier applied to the requests ("batch", "flex", "discount", "flex_discount", "priority", "priority_on_demand", "standard").
      - name: context_window
        description: Context window used ("0-200k", "200k-1M").
      - name: cache_read_input_token
        description: The number of input tokens read from the cache.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__enterprise_user_usage_report
    description: Staged per-user token usage report for enterprise accounts.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: enterprise_user_usage_report_id
        description: Fivetran-generated unique identifier for the row.
        tests:
          - not_null
      - name: actor_user_id
        description: Identifier of the `enterprise_user_actor`.
      - name: count_requests
        description: Number of API requests in this row's scope.
      - name: cache_creation_ephemeral_1_h_input_token
        description: The number of input tokens used to create the 1 hour cache entry.
      - name: cache_creation_ephemeral_5_m_input_token
        description: The number of input tokens used to create the 5 minute cache entry.
      - name: product
        description: Anthropic product surface that produced the usage ("chat", "claude_code", "cowork", "office_agent", "claude_in_chrome", "claude_design", "claude-tag" aka Claude in Slack, "other").
      - name: starting_date
        description: Start of the reporting period (cast to date).
      - name: ending_date
        description: End of the reporting period (cast to date).
      - name: output_token
        description: The number of output tokens generated.
      - name: data_refreshed_at
        description: Timestamp of the export this response was served from. Data is typically refreshed every 4 hours but not final until about 30 days after the usage date (late-arriving events, reconciliation adjustments).
      - name: speed
        description: Inference speed tier ("fast", "standard").
      - name: server_tool_use_web_search_request
        description: The number of server-side web search requests made.
      - name: uncached_input_token
        description: The number of uncached input tokens processed.
      - name: organization_id
        description: Identifier of the organization.
      - name: model
        description: Claude model that served the requests.
      - name: context_window
        description: Context window size tier ("0-200k", "200k-1M").
      - name: inference_geo
        description: Geographic region where inference ran ("global", "not_available", "us").
      - name: cache_read_input_token
        description: The number of input tokens read from the cache.
      - name: total_token
        description: Total token count across all token types.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__claude_code_usage_report
    description: Staged Claude Code usage report. Each row represents activity for one actor on one day.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: claude_code_usage_report_id
        description: Fivetran-generated unique identifier for the row.
        tests:
          - not_null
      - name: organization_id
        description: Identifier of the organization.
      - name: customer_type
        description: Type of customer account ("api" for API customers, "subscription" for Pro/Team customers).
      - name: report_date
        description: Date the usage occurred.
      - name: terminal_type
        description: Type of terminal or environment where Claude Code was used.
      - name: actor_type
        description: Type of actor ("api_actor", "user_actor").
      - name: actor_api_key_name
        description: Name of the API key used to perform Claude Code actions when `actor_type` is "api_actor".
      - name: actor_email_address
        description: Email address of the user who performed Claude Code actions when `actor_type` is "user_actor".
      - name: core_metrics_pull_requests_by_claude_code
        description: Number of pull requests created through Claude Code's PR functionality.
      - name: core_metrics_lines_of_code_removed
        description: Total number of lines of code removed across all files by Claude Code.
      - name: core_metrics_lines_of_code_added
        description: Total number of lines of code added across all files by Claude Code.
      - name: core_metrics_commits_by_claude_code
        description: Number of git commits created through Claude Code's commit functionality.
      - name: core_metrics_num_sessions
        description: Number of distinct Claude Code sessions initiated by this actor.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__claude_code_usage_report_model_breakdown
    description: Staged token and cost breakdown by model for each Claude Code usage report row.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: claude_code_usage_report_fivetran_id
        description: Foreign key to stg_claude__claude_code_usage_report.claude_code_usage_report_id.
        tests:
          - not_null
      - name: model
        description: Name of the AI model used for Claude Code interactions.
        tests:
          - not_null
      - name: tokens_output
        description: Number of output tokens generated by this model.
      - name: tokens_input
        description: Number of input tokens consumed by this model.
      - name: estimated_cost_currency
        description: Currency code for the estimated cost (e.g., 'USD').
      - name: tokens_cache_creation
        description: Number of cache creation tokens consumed by this model.
      - name: estimated_cost_amount
        description: Estimated cost amount in minor currency units (e.g., cents for USD).
      - name: tokens_cache_read
        description: Number of cache read tokens consumed by this model.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__users
    description: Staged workspace users with role and membership metadata.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_id
        description: Unique identifier for the user.
        tests:
          - not_null
      - name: added_at
        description: Timestamp when the user joined the organization.
      - name: role
        description: Organization role of the user ("admin", "billing", "claude_code_user", "developer", "managed", "membership_admin", "owner", "primary_owner", "user").
      - name: name
        description: Display name of the user.
      - name: type
        description: Object type ("user").
      - name: email
        description: Email address of the user.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__enterprise_user_actor
    description: Staged enterprise actors referenced in usage and cost reports.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: actor_id
        description: Unique identifier for the actor.
        tests:
          - not_null
      - name: is_deleted
        description: True when the account has been deleted, or when the user is no longer a member of the organization or its associated organizations.
      - name: name
        description: Full name of the user actor, if provided. May be "Deleted User" for deleted or deprovisioned accounts.
      - name: type
        description: Always "user_actor".
      - name: email
        description: The user's email address, including for users who are no longer members of the organization or its associated organizations. Null when the account has been deleted and for system-minted service accounts.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__api_key
    description: Staged API keys belonging to the organization's workspaces.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: api_key_id
        description: Unique identifier for the API key.
        tests:
          - not_null
      - name: workspace_id
        description: ID of the Workspace the API key belongs to. Joins to `stg_claude__workspace.workspace_id`.
      - name: name
        description: Name of the API key.
      - name: partial_key_hint
        description: Partially redacted hint of the key value, used to identify a key without exposing it.
      - name: status
        description: Status of the API key ("active", "archived", "inactive").
      - name: created_at
        description: Timestamp when the API key was created.
      - name: created_by_id
        description: Identifier of the actor that created the API key.
      - name: created_by_type
        description: Type of actor that created the API key.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__workspace
    description: Staged workspaces within the organization. Workspaces group API keys and scope usage and cost reporting.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: workspace_id
        description: Unique identifier for the workspace.
        tests:
          - not_null
      - name: name
        description: Name of the workspace.
      - name: created_at
        description: Timestamp when the workspace was created.
      - name: display_color
        description: Hex color used to display the workspace in the Anthropic Console.
      - name: type
        description: Object type ("workspace").
      - name: data_residency_workspace_geo
        description: Geographic region where the workspace's data resides.
      - name: data_residency_default_inference_geo
        description: Default geographic region used for inference in this workspace.
      - name: data_residency_allowed_inference_geo
        description: Geographic regions where inference is permitted for this workspace.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_claude__enterprise_user_activity
    description: Staged daily per-user activity metrics across Anthropic product surfaces. One row per user per day.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: activity_date
        description: Date the activity occurred.
        tests:
          - not_null
      - name: user_id
        description: Identifier of the user the activity belongs to. Joins to `stg_claude__enterprise_user_actor.actor_id`.
        tests:
          - not_null
      - name: chat_metrics_connectors_used_count
        description: Number of connector invocations in Claude chat.
      - name: chat_metrics_distinct_artifacts_created_count
        description: Number of distinct artifacts created in Claude chat.
      - name: chat_metrics_distinct_conversation_count
        description: Number of distinct conversations in Claude chat.
      - name: chat_metrics_distinct_files_uploaded_count
        description: Number of distinct files uploaded in Claude chat.
      - name: chat_metrics_distinct_projects_created_count
        description: Number of distinct projects created in Claude chat.
      - name: chat_metrics_distinct_projects_used_count
        description: Number of distinct projects used in Claude chat.
      - name: chat_metrics_distinct_shared_artifacts_viewed_count
        description: Number of distinct shared artifacts viewed in Claude chat.
      - name: chat_metrics_distinct_skills_used_count
        description: Number of distinct skills used in Claude chat.
      - name: chat_metrics_message_count
        description: Number of messages sent in Claude chat.
      - name: chat_metrics_shared_conversations_viewed_count
        description: Number of shared conversations viewed in Claude chat.
      - name: chat_metrics_thinking_message_count
        description: Number of messages that used extended thinking in Claude chat.
      - name: claude_code_metrics_core_metrics_commit_count
