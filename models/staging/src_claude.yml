version: 2

sources:
  - name: claude
    schema: "{{ var('claude_schema', 'anthropic_claude') }}"
    database: "{% if target.type not in ('spark') %}{{ var('claude_database', target.database) }}{% endif %}"
    description: Raw tables synced by the Fivetran Claude (Anthropic) connector.
    tables:

      - name: cost_report
        identifier: "{{ var('claude__cost_report_identifier', 'cost_report') }}"
        description: Organization-level cost report. Each row is one billing line item for a given model, token type, and time period.
        columns:
          - name: _fivetran_id
            description: Fivetran-generated unique identifier for the row.
          - name: workspace_id
            description: ID of the Workspace this cost is associated with.
          - name: amount
            description: Cost amount in lowest currency units (e.g. cents) as a decimal string. For example, "123.45" in "USD" represents $1.23.
          - name: cost_type
            description: Category of cost ("code_execution", "session_usage", "tokens", "web_search").
          - name: starting_at
            description: Start of the billing period,
          - name: ending_at
            description: End of the billing period.
          - name: description
            description: Human-readable description of the cost line item.
          - name: token_type
            description: Token type contributing to the cost ("cache_creation.ephemeral_1h_input_tokens", "cache_creation.ephemeral_5m_input_tokens", "cache_read_input_tokens", "output_tokens", "uncached_input_tokens")
          - name: model
            description: Claude model associated with the cost.
          - name: service_tier
            description: Service tier applied to the request ("batch", "standard").
          - name: currency
            description: Currency code for the cost amount. Currently always "USD".
          - name: context_window
            description: Input context window used ("0-200k", "200k-1M").
          - name: inference_geo
            description: Geographic region where inference ran ("global", "not_available", "us").
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: enterprise_user_cost_report
        identifier: "{{ var('claude__enterprise_user_cost_report_identifier', 'enterprise_user_cost_report') }}"
        description: Per-user cost report for enterprise accounts. Each row is the cost for one actor over a time period.
        columns:
          - name: _fivetran_id
            description: Fivetran-generated unique identifier for the row.
          - name: actor_user_id
            description: Identifier of the `enterprise_user_actor`.
          - name: product
            description: Anthropic product surface that produced the cost ("chat", "claude_code", "cowork", "office_agent", "claude_in_chrome", "claude_design", "claude-tag" aka Claude in Slack, "other").
          - name: amount
            description: Amount (post-discount, pre-credit) in fractional cents (minor units).
          - name: starting_date
            description: Start of the reporting period.
          - name: ending_date
            description: End of the reporting period.
          - name: cost_type
            description: Category of cost ("code_execution", "tokens", "web_search")
          - name: token_type
            description: Token type contributing to the cost ("cache_creation.ephemeral_1h_input_tokens", "cache_creation.ephemeral_5m_input_tokens", "cache_read_input_tokens", "output_tokens", "uncached_input_tokens")
          - name: data_refreshed_at
            description: Timestamp of the export this response was served from. Data is typically refreshed every 4 hours but not final until about 30 days after the usage date (late-arriving events, reconciliation adjustments).
          - name: speed
            description: Inference speed tier ("fast", "standard").
          - name: list_amount
            description: List-price amount (pre-discount) in fractional cents.
          - name: organization_id
            description: Identifier of the organization.
          - name: model
            description: Claude model associated with the cost.
          - name: currency
            description: Currency code for the cost amount. Currently always "USD".
          - name: context_window
            description: Input context window used ("0-200k", "200k-1M").
          - name: inference_geo
            description: Geographic region where inference ran ("global", "not_available", "us").
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: message_usage_report
        identifier: "{{ var('claude__message_usage_report_identifier', 'message_usage_report') }}"
        description: API message usage report. Each row is the token usage for one API request bucket.
        columns:
          - name: _fivetran_id
            description: Fivetran-generated unique identifier for the row.
          - name: api_key_id
            description: Identifier of the API key used for the requests.
          - name: workspace_id
            description: Identifier of the workspace.
          - name: cache_creation_ephemeral_1_h_input_token
            description: The number of input tokens used to create the 1 hour cache entry.
          - name: cache_creation_ephemeral_5_m_input_token
            description: The number of input tokens used to create the 5 minute cache entry.
          - name: starting_at
            description: Start of the usage period.
          - name: ending_at
            description: End of the usage period.
          - name: output_token
            description: The number of output tokens generated.
          - name: server_tool_use_web_search_request
            description: The number of server-side web search requests made.
          - name: uncached_input_token
            description: The number of uncached input tokens processed.
          - name: model
            description: Claude model that served the requests.
          - name: service_tier
            description: Service tier applied to the requests ("batch", "flex", "discount", "flex_discount", "priority", "priority_on_demand", "standard").
          - name: context_window
            description: Context window used ("0-200k", "200k-1M").
          - name: cache_read_input_token
            description: The number of input tokens read from the cache.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: enterprise_user_usage_report
        identifier: "{{ var('claude__enterprise_user_usage_report_identifier', 'enterprise_user_usage_report') }}"
        description: Per-user token usage report for enterprise accounts. Each row is the usage for one actor over a time period.
        columns:
          - name: _fivetran_id
            description: Fivetran-generated unique identifier for the row.
          - name: actor_user_id
            description: Identifier of the `enterprise_user_actor`.
          - name: request
            description: Number of API requests in this row's scope.
          - name: cache_creation_ephemeral_1_h_input_token
            description: The number of input tokens used to create the 1 hour cache entry.
          - name: product
            description: Anthropic product surface that produced the usage ("chat", "claude_code", "cowork", "office_agent", "claude_in_chrome", "claude_design", "claude-tag" aka Claude in Slack, "other").
          - name: starting_date
            description: Start of the reporting period.
          - name: cache_creation_ephemeral_5_m_input_token
            description: The number of input tokens used to create the 5 minute cache entry.
          - name: output_token
            description: The number of output tokens generated.
          - name: data_refreshed_at
            description: Timestamp of the export this response was served from. Data is typically refreshed every 4 hours but not final until about 30 days after the usage date (late-arriving events, reconciliation adjustments).
          - name: speed
            description: Inference speed tier ("fast", "standard").
          - name: server_tool_use_web_search_request
            description: The number of server-side web search requests made.
          - name: uncached_input_token
            description: The number of uncached input tokens processed.
          - name: organization_id
            description: Identifier of the organization.
          - name: model
            description: Claude model that served the requests.
          - name: context_window
            description: Context window size tier ("0-200k", "200k-1M").
          - name: ending_date
            description: End of the reporting period.
          - name: inference_geo
            description: Geographic region where inference ran ("global", "not_available", "us").
          - name: cache_read_input_token
            description: The number of input tokens read from the cache.
          - name: total_token
            description: Total token count across all token types.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: claude_code_usage_report
        identifier: "{{ var('claude__claude_code_usage_report_identifier', 'claude_code_usage_report') }}"
        description: Claude Code usage report. Each row is the activity for one actor on one day.
        columns:
          - name: _fivetran_id
            description: Fivetran-generated unique identifier for the row.
          - name: organization_id
            description: Identifier of the organization.
          - name: customer_type
            description: Type of customer account ("api" for API customers, "subscription" for Pro/Team customers).
          - name: date
            description: Date the usage occurred.
          - name: terminal_type
            description: Type of terminal or environment where Claude Code was used.
          - name: actor_type
            description: Type of actor ("api_actor", "user_actor").
          - name: actor_api_key_name
            description: Name of the API key used to perform Claude Code actions when `actor_type` is "api_actor".
          - name: actor_email_address
            description: Email address of the user who performed Claude Code actions when `actor_type` is "user_actor".
          - name: core_metrics_pull_requests_by_claude_code
            description: Number of pull requests created through Claude Code's PR functionality.
          - name: core_metrics_lines_of_code_removed
            description: Total number of lines of code removed across all files by Claude Code.
          - name: core_metrics_lines_of_code_added
            description: Total number of lines of code added across all files by Claude Code.
          - name: core_metrics_commits_by_claude_code
            description: Number of git commits created through Claude Code's commit functionality.
          - name: core_metrics_num_sessions
            description: Number of distinct Claude Code sessions initiated by this actor.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: claude_code_usage_report_model_breakdown
        identifier: "{{ var('claude__claude_code_usage_report_model_breakdown_identifier', 'claude_code_usage_report_model_breakdown') }}"
        description: Token and cost breakdown by model for each Claude Code usage report row. Unique on claude_code_usage_report_fivetran_id and model.
        columns:
          - name: claude_code_usage_report_fivetran_id
            description: Foreign key to claude_code_usage_report._fivetran_id.
          - name: model
            description: Name of the AI model used for Claude Code interactions.
          - name: tokens_output
            description: Number of output tokens generated by this model.
          - name: tokens_input
            description: Number of input tokens consumed by this model.
          - name: estimated_cost_currency
            description: Currency code for the estimated cost (e.g., 'USD').
          - name: tokens_cache_creation
            description: Number of cache creation tokens consumed by this model.
          - name: estimated_cost_amount
            description: Estimated cost amount in minor currency units (e.g., cents for USD).
          - name: tokens_cache_read
            description: Number of cache read tokens consumed by this model.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: users
        identifier: "{{ var('claude__users_identifier', 'users') }}"
        description: Workspace users with role and membership metadata.
        columns:
          - name: id
            description: Unique identifier for the user.
          - name: added_at
            description: Timestamp when the user joined the organization.
          - name: role
            description: Organization role of the user ("admin", "billing", "claude_code_user", "developer", "managed", "membership_admin", "owner", "primary_owner", "user").
          - name: name
            description: Display name of the user.
          - name: type
            description: Object type ("user").
          - name: email
            description: Email address of the user.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: enterprise_user_actor
        identifier: "{{ var('claude__enterprise_user_actor_identifier', 'enterprise_user_actor') }}"
        description: Enterprise actors referenced by the usage and cost reports. An actor is either a user or an API key.
        columns:
          - name: id
            description: Unique identifier for the actor.
          - name: deleted
            description: True when the account has been deleted, or when the user is no longer a member of the organization or its associated organizations
          - name: name
            description: Full name of the user actor, if provided. May be "Deleted User" for deleted or deprovisioned accounts.
          - name: type
            description: Always "user_actor".
          - name: email
            description: The user's email address, including for users who are no longer members of the organization or its associated organizations. Null when the account has been deleted and for system-minted service accounts.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: api_key
        identifier: "{{ var('claude__api_key_identifier', 'api_key') }}"
        description: API keys belonging to the organization's workspaces.
        columns:
          - name: id
            description: Unique identifier for the API key.
          - name: workspace_id
            description: ID of the Workspace the API key belongs to.
          - name: name
            description: Name of the API key.
          - name: partial_key_hint
            description: Partially redacted hint for the API key.
          - name: type
            description: Object type ("api_key").
          - name: status
            description: Status of the API key ("active", "archived", "expired", "inactive").
          - name: created_at
            description: Timestamp when the API key was created.
          - name: created_by_id
            description: Identifier of the actor that created the API key. null when the creator is not recorded (legacy, workload-identity-federated, or system-created keys).
          - name: created_by_type
            description: Type of actor that created the API key ("service_account", "user").
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: workspace
        identifier: "{{ var('claude__workspace_identifier', 'workspace') }}"
        description: Workspaces within the organization. Workspaces group API keys and scope usage and cost reporting.
        columns:
          - name: id
            description: Unique identifier for the workspace.
          - name: name
            description: Name of the workspace.
          - name: created_at
            description: Timestamp when the workspace was created.
          - name: display_color
            description: Hex color code representing the Workspace in the Anthropic Console.
          - name: type
            description: Object type ("workspace").
          - name: data_residency_workspace_geo
            description: Geographic region for workspace data storage. Immutable after creation.
          - name: data_residency_default_inference_geo
            description: Default inference geo applied when requests omit the parameter.
          - name: data_residency_allowed_inference_geo
            description: Permitted inference geo values. 'unrestricted' means all geos are allowed.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"

      - name: enterprise_user_activity
        identifier: "{{ var('claude__enterprise_user_activity_identifier', 'enterprise_user_activity') }}"
        description: Daily per-user activity metrics across Anthropic product surfaces. One row per user per day.
        columns:
          - name: date
            description: Date the activity occurred.
          - name: user_id
            description: Identifier of the user the activity belongs to. Joins to `enterprise_user_actor.id`.
          - name: chat_metrics_connectors_used_count
            description: Number of connector invocations in Claude chat.
          - name: chat_metrics_distinct_artifacts_created_count
            description: Number of distinct artifacts created in Claude chat.
          - name: chat_metrics_distinct_conversation_count
            description: Number of distinct conversations in Claude chat.
          - name: chat_metrics_distinct_files_uploaded_count
            description: Number of distinct files uploaded in Claude chat.
          - name: chat_metrics_distinct_projects_created_count
            description: Number of distinct projects created in Claude chat.
          - name: chat_metrics_distinct_projects_used_count
            description: Number of distinct projects used in Claude chat.
          - name: chat_metrics_distinct_shared_artifacts_viewed_count
            description: Number of distinct shared artifacts viewed in Claude chat.
          - name: chat_metrics_distinct_skills_used_count
            description: Number of distinct skills used in Claude chat.
          - name: chat_metrics_message_count
            description: Number of messages sent in Claude chat.
          - name: chat_metrics_shared_conversations_viewed_count
            description: Number of shared conversations viewed in Claude chat.
          - name: chat_metrics_thinking_message_count
            description: Number of messages that used extended thinking in Claude chat.
          - name: claude_code_metrics_core_metrics_commit_count
            description: Number of git commits created in Claude Code.
          - name: claude_code_metrics_core_metrics_distinct_session_count
            description: Number of distinct sessions in Claude Code.
          - name: claude_code_metrics_core_metrics_lines_of_code_added_count
            description: Lines of code added in Claude Code.
          - name: claude_code_metrics_core_metrics_lines_of_code_removed_count
            description: Lines of code removed in Claude Code.
          - name: claude_code_metrics_core_metrics_pull_request_count
            description: Number of pull requests created in Claude Code.
          - name: claude_code_metrics_tool_actions_edit_tool_accepted_count
            description: Number of accepted Edit tool actions in Claude Code.
          - name: claude_code_metrics_tool_actions_edit_tool_rejected_count
            description: Number of rejected Edit tool actions in Claude Code.
          - name: claude_code_metrics_tool_actions_multi_edit_tool_accepted_count
            description: Number of accepted MultiEdit tool actions in Claude Code.
          - name: claude_code_metrics_tool_actions_multi_edit_tool_rejected_count
            description: Number of rejected MultiEdit tool actions in Claude Code.
          - name: claude_code_metrics_tool_actions_notebook_edit_tool_accepted_count
            description: Number of accepted NotebookEdit tool actions in Claude Code.
          - name: claude_code_metrics_tool_actions_notebook_edit_tool_rejected_count
            description: Number of rejected NotebookEdit tool actions in Claude Code.
          - name: claude_code_metrics_tool_actions_write_tool_accepted_count
            description: Number of accepted Write tool actions in Claude Code.
          - name: claude_code_metrics_tool_actions_write_tool_rejected_count
            description: Number of rejected Write tool actions in Claude Code.
          - name: cowork_metrics_action_count
            description: Number of actions taken in Claude Cowork.
          - name: cowork_metrics_connectors_used_count
            description: Number of connector invocations in Claude Cowork.
          - name: cowork_metrics_dispatch_turn_count
            description: Number of dispatch turns in Claude Cowork.
          - name: cowork_metrics_distinct_connectors_used_count
            description: Number of distinct connectors used in Claude Cowork.
          - name: cowork_metrics_distinct_session_count
            description: Number of distinct sessions in Claude Cowork.
          - name: cowork_metrics_distinct_skills_used_count
            description: Number of distinct skills used in Claude Cowork.
          - name: cowork_metrics_message_count
            description: Number of messages sent in Claude Cowork.
          - name: cowork_metrics_skills_used_count
            description: Number of skill invocations in Claude Cowork.
          - name: design_metrics_distinct_projects_created_count
            description: Number of distinct projects created in Claude Design.
          - name: design_metrics_distinct_projects_used_count
            description: Number of distinct projects used in Claude Design.
          - name: design_metrics_distinct_session_count
            description: Number of distinct sessions in Claude Design.
          - name: design_metrics_message_count
            description: Number of messages sent in Claude Design.
          - name: office_metrics_excel_connectors_used_count
            description: Number of connector invocations in Claude for Excel.
          - name: office_metrics_excel_distinct_connectors_used_count
            description: Number of distinct connectors used in Claude for Excel.
          - name: office_metrics_excel_distinct_session_count
            description: Number of distinct sessions in Claude for Excel.
          - name: office_metrics_excel_distinct_skills_used_count
            description: Number of distinct skills used in Claude for Excel.
          - name: office_metrics_excel_message_count
            description: Number of messages sent in Claude for Excel.
          - name: office_metrics_excel_skills_used_count
            description: Number of skill invocations in Claude for Excel.
          - name: office_metrics_outlook_connectors_used_count
            description: Number of connector invocations in Claude for Outlook.
          - name: office_metrics_outlook_distinct_connectors_used_count
            description: Number of distinct connectors used in Claude for Outlook.
          - name: office_metrics_outlook_distinct_session_count
            description: Number of distinct sessions in Claude for Outlook.
          - name: office_metrics_outlook_distinct_skills_used_count
            description: Number of distinct skills used in Claude for Outlook.
          - name: office_metrics_outlook_message_count
            description: Number of messages sent in Claude for Outlook.
          - name: office_metrics_outlook_skills_used_count
            description: Number of skill invocations in Claude for Outlook.
          - name: office_metrics_powerpoint_connectors_used_count
            description: Number of connector invocations in Claude for PowerPoint.
          - name: office_metrics_powerpoint_distinct_connectors_used_count
            description: Number of distinct connectors used in Claude for PowerPoint.
          - name: office_metrics_powerpoint_distinct_session_count
            description: Number of distinct sessions in Claude for PowerPoint.
          - name: office_metrics_powerpoint_distinct_skills_used_count
            description: Number of distinct skills used in Claude for PowerPoint.
          - name: office_metrics_powerpoint_message_count
            description: Number of messages sent in Claude for PowerPoint.
          - name: office_metrics_powerpoint_skills_used_count
            description: Number of skill invocations in Claude for PowerPoint.
          - name: office_metrics_word_connectors_used_count
            description: Number of connector invocations in Claude for Word.
          - name: office_metrics_word_distinct_connectors_used_count
            description: Number of distinct connectors used in Claude for Word.
          - name: office_metrics_word_distinct_session_count
            description: Number of distinct sessions in Claude for Word.
          - name: office_metrics_word_distinct_skills_used_count
            description: Number of distinct skills used in Claude for Word.
          - name: office_metrics_word_message_count
            description: Number of messages sent in Claude for Word.
          - name: office_metrics_word_skills_used_count
            description: Number of skill invocations in Claude for Word.
          - name: web_search_count
            description: Number of web searches performed across all surfaces.
          - name: _fivetran_deleted
            description: "{{ doc('_fivetran_deleted') }}"
          - name: _fivetran_synced
            description: "{{ doc('_fivetran_synced') }}"
